<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <!-- Coordinates share the original title artwork, so cover/cropping stay aligned. -->
  <defs>
    <radialGradient id="halo"><stop stop-color="#ffb34e" stop-opacity=".65"/><stop offset=".4" stop-color="#ff771a" stop-opacity=".3"/><stop offset="1" stop-color="#ff6410" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <radialGradient id="cyan-halo"><stop stop-color="#a6ffff" stop-opacity=".7"/><stop offset=".38" stop-color="#35e9ff" stop-opacity=".4"/><stop offset="1" stop-color="#00bfff" stop-opacity="0"/></radialGradient>
    <filter id="eye-soft" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <ellipse cx="1352" cy="461" rx="78" ry="92" fill="url(#halo)"/>
  <path d="M1345 416 L1361 413 L1375 461 L1350 506 L1337 501 L1327 460 Z" fill="#ffba62" opacity=".65" filter="url(#soft)"/>
  <!-- Blue muzzle lens and the two narrow eye slits in the original artwork. -->
  <ellipse cx="713" cy="416" rx="76" ry="83" fill="url(#cyan-halo)"/>
  <ellipse cx="715" cy="417" rx="29" ry="39" transform="rotate(-13 715 417)" fill="#8af7ff" opacity=".68" filter="url(#soft)"/>
  <ellipse cx="1230" cy="248" rx="61" ry="35" fill="url(#cyan-halo)" opacity=".55"/>
  <path d="M1192 233 L1203 246 L1221 259 L1214 257 L1200 248 Z M1225 258 L1243 242 L1272 227 L1266 243 L1243 255 L1225 264 Z" fill="#aaffff" opacity=".85" filter="url(#eye-soft)"/>
</svg>
